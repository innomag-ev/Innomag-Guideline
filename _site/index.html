<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>INNOMAG Guideline</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: #f7f7f7;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
    }

    .innomag-landing-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 2rem;
    }

    .innomag-landing-card {
      width: 100%;
      max-width: 720px;
      text-align: center;
      background: white;
      padding: 3rem 2.5rem;
      box-sizing: border-box;
      border-radius: 0.5rem;
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.08);
    }

    .innomag-landing-title {
      margin: 0 0 0.75rem 0;
      font-size: 2rem;
      font-weight: 600;
    }

    .innomag-landing-subtitle {
      margin: 0 auto 2.5rem auto;
      max-width: 600px;
      font-size: 1.05rem;
      line-height: 1.5;
      color: #555;
    }

    .innomag-language-buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .innomag-language-button {
      display: inline-block;
      min-width: 110px;
      padding: 0.65rem 1.1rem;

      border: 1px solid #555;
      border-radius: 0.35rem;

      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      color: #222;
    }

    .innomag-language-button-de {
      background-color: #ecd2cf;
    }

    .innomag-language-button-en {
      background-color: #b7daf8;
    }

    .innomag-language-button:hover {
      filter: brightness(0.95);
    }
  </style>
</head>

<body>

  <main class="innomag-landing-page">

    <div class="innomag-landing-card">

      <h1 class="innomag-landing-title">
        INNOMAG Guideline
      </h1>

      <p class="innomag-landing-subtitle">
        Magnetic Measurement Scales for Position and Angle Measurement
      </p>

      <div class="innomag-language-buttons">

        <a
          class="innomag-language-button innomag-language-button-de"
          href="de/index.html">
          Deutsch
        </a>

        <a
          class="innomag-language-button innomag-language-button-en"
          href="en/index.html">
          English
        </a>

      </div>

    </div>

  </main>

</body>
</html>
